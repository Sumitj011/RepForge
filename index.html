<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>RepForge</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
  --text:#eef0f4; --muted:#8b93a3; --accent:#ff6b2c; --accent-ink:#1a0d05;
  --ok:#3ddc97; --danger:#ff5d6c;
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --card:#ffffff; --card2:#eef0f4; --line:#dde1e8;
  --text:#14171c; --muted:#677084; --accent:#e8530e; --accent-ink:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:10;
  border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0;letter-spacing:.3px;font-weight:800}
header h1 span{color:var(--accent)}
.made{font-size:11px;color:var(--muted);margin-top:1px;letter-spacing:.2px}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer;line-height:1}
main{max-width:640px;margin:0 auto;padding:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px;
  font-size:12px;cursor:pointer}
.tabs button b{display:block;font-size:20px;font-weight:400}
.tabs button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:16px;margin:0}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;
  padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
button.danger{color:var(--danger)}
input,select{background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:11px;font-size:16px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.stepper{display:flex;align-items:stretch;gap:6px}
.stepper button{width:44px;background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;font-size:22px;cursor:pointer}
.stepper input{text-align:center;font-weight:700;font-size:20px;padding:8px 2px}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.set{display:flex;justify-content:space-between;align-items:center;background:var(--card2);
  border-radius:10px;padding:8px 12px;font-size:15px}
.set .n{color:var(--muted);width:28px}
.set button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);margin:2px 2px 0 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));
  max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--accent);
  border-radius:16px;padding:12px 14px;z-index:7;display:none}
.restbar.show{display:block}
.restbar.done{border-color:var(--ok)}
.restbar .time{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.progress{height:6px;background:var(--card2);border-radius:99px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.restbar.done .progress i{background:var(--ok)}
.ex-item{display:grid;grid-template-columns:1fr 66px 66px 40px;gap:8px;align-items:end;margin-bottom:10px}
.hist-ex{margin-top:8px;font-size:14px}
.hist-ex b{display:block}
.hidden{display:none!important}
.status{font-size:12px;color:var(--muted);margin-right:8px}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;
  padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px}
.badge.ok{background:var(--ok);color:#06241a}

/* summary overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:420px;width:100%;text-align:center}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.sumgrid div{background:var(--card2);border-radius:14px;padding:12px}
.sumgrid b{display:block;font-size:24px}
.sumgrid span{font-size:12px;color:var(--muted)}

/* exercise checklist */
[data-ex]{scroll-margin-top:70px}
.tick{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2px solid var(--line);background:var(--card2);
  color:var(--ok);font-size:18px;font-weight:800;cursor:pointer;padding:0;line-height:1}
.tick.on{background:var(--ok);border-color:var(--ok);color:#06241a}
.exrow{display:flex;align-items:center;gap:12px;padding:12px}
.exrow .info{flex:1;min-width:0}
.exrow.isdone h3{text-decoration:line-through;color:var(--muted)}
.exrow .start{white-space:nowrap;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.exrow.isdone .start{background:var(--card2);color:var(--text);border-color:var(--line);font-weight:400}
.wprog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.wprog i{display:block;height:100%;background:var(--ok);transition:width .25s}

/* menu */
.menu-wrap{position:relative;display:flex;align-items:center}
.menu{position:absolute;right:0;top:48px;min-width:240px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:20}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);
  padding:11px 12px;border-radius:10px;font-size:15px;cursor:pointer}
.menu button:hover{background:var(--card2)}
.menu button span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.menu .who{padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all}

/* toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--text);
  color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;
  transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* home */
.hero{background:linear-gradient(135deg,#ff6b2c,#ff2d6f);color:#fff;border-radius:20px;padding:20px;
  margin-bottom:14px;position:relative}
.hero .hi{font-size:14px;opacity:.9}
.hero h2{font-size:24px;margin:2px 0 16px;color:#fff}
.hero blockquote{margin:0;font-size:19px;font-weight:700;line-height:1.35;padding-right:6px}
.hero .shuf{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.22);border:0;color:#fff;
  border-radius:10px;width:36px;height:36px;font-size:17px;cursor:pointer}
.actions2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--text);
  padding:16px 10px;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.tile b{display:block;font-size:26px;margin-bottom:4px;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wd{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;
  font-size:11px;color:var(--muted)}
.wd span{display:block;font-weight:700;font-size:12px}
.wd i{display:block;font-style:normal;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.wd.today{border-color:var(--accent)}
.wd.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* planner */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:999px;
  padding:8px 14px;font-size:14px;cursor:pointer}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.dp{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 0;
  font-size:13px;cursor:pointer;position:relative}
.dp.sel{border-color:var(--accent);outline:2px solid var(--accent)}
.dp.on::after{content:'';position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.plan-ex{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px}
.plan-ex .nm{flex:1;min-width:0}
.plan-ex .n{color:var(--muted);width:20px}
.plan-ex button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 6px}
.plan-ex .cfg{flex-basis:100%;display:flex;gap:8px;padding-left:28px}
.plan-ex .cfg > div{flex:1}
.plan-ex .cfg > div.sm{flex:0 0 72px}
.plan-ex .cfg input{padding:8px;font-size:15px;background:var(--card)}

/* body */
.bmi-num{font-size:46px;font-weight:800;line-height:1}
.bmi-bar{height:12px;border-radius:99px;position:relative;margin:18px 0 6px;
  background:linear-gradient(90deg,#4ea3ff 0 14%,#3ddc97 14% 40%,#ffb84d 40% 60%,#ff5d6c 60% 100%)}
.bmi-bar i{position:absolute;top:-5px;width:4px;height:22px;background:var(--text);border-radius:2px;transform:translateX(-50%)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <div>
    <h1>Rep<span>Forge</span></h1>
    <div class="made">Made with 💓 by Spirit</div>
  </div>
  <div class="row">
    <span class="status" id="saveStatus"></span>
    <div class="menu-wrap">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">⋮</button>
      <div class="menu hidden" id="menu"></div>
    </div>
  </div>
</header>

<main id="view"></main>

<div class="restbar" id="restbar">
  <div class="row between">
    <div>
      <div class="muted" id="restLabel">Rest</div>
      <div class="time" id="restTime">0:00</div>
    </div>
    <div class="row">
      <button class="ghost" data-act="rest-adj" data-d="-15">−15s</button>
      <button class="ghost" data-act="rest-adj" data-d="15">+15s</button>
      <button class="ghost" data-act="rest-skip">Skip</button>
    </div>
  </div>
  <div class="progress"><i id="restProg"></i></div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay hidden" id="summary"></div>

<nav class="tabs hidden" id="tabs">
  <button data-tab="home"><b>🏠</b>Home</button>
  <button data-tab="workout"><b>🏋️</b>Workout</button>
  <button data-tab="plan"><b>📅</b>Plan</button>
  <button data-tab="history"><b>📈</b>History</button>
  <button data-tab="body"><b>⚖️</b>Body</button>
</nav>

<input type="file" id="importFile" accept="application/json" class="hidden">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, collection, query, orderBy, onSnapshot, setDoc, deleteDoc, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* =====================================================================
   FIREBASE (optional sign-in)
   Guest mode: everything is saved on this device (localStorage).
   Signed in: data lives in Firestore and syncs across devices.
     users/{uid}/meta/state      -> { exercises, active, plan, profile, updatedAt }
     users/{uid}/sessions/{id}   -> one finished workout per document

   Exercise:  { id, name, rest, restEx }
     rest   = seconds of rest between sets of this exercise
     restEx = seconds of rest after the LAST set, before the next exercise
   Plan day:  { on, name, ex:[ids], cfg:{ [exId]:{ sets, reps } } }
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB0OKzT7-bpoVSSlQtMP1P51U-ZC_vUHcw",
  authDomain: "workout-lift-log.firebaseapp.com",
  projectId: "workout-lift-log",
  storageBucket: "workout-lift-log.firebasestorage.app",
  messagingSenderId: "1085511970911",
  appId: "1:1085511970911:web:68ad123861823a5cd46bea"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try {
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) { db = getFirestore(app); }

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtRest = (s) => s >= 60 ? (s % 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : (s / 60) + ' min') : s + ' sec';
const num = (v, d = 0) => { const n = parseFloat(v); return isNaN(n) ? d : n; };
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const todayIdx = () => (new Date().getDay() + 6) % 7;
const pad2 = (n) => String(n).padStart(2, '0');
const dateStr = (ts = Date.now()) => { const d = new Date(ts); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const addDays = (ts, n) => { const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); };
const mondayOf = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };

const DEF_REST = 30;      // between sets (sec)
const DEF_REST_EX = 60;   // after the last set of an exercise (sec)
const exRest = (ex) => ex.restEx == null ? DEF_REST_EX : ex.restEx;

/* exercise types: 'weight' (kg x reps), 'bw' (bodyweight reps, optional extra kg), 'timed' (hold + countdown) */
const TIMED_RE = /^(plank|side plank|dead hang|deep squat hold|forward fold)/i;
const BW_RE = /^(pull-ups|push-ups|close-grip push-ups|hanging (knee|leg) raises|reverse crunch|russian twist|walking lunges|bicycle crunch|cat-cow|world's greatest stretch|shoulder dislocates|glute bridges|90\/90|ankle mobility|thoracic rotations|chin-ups|dips|sit-ups|crunch)/i;
const exType = (ex) => ex.type || (TIMED_RE.test(ex.name) ? 'timed' : BW_RE.test(ex.name) ? 'bw' : 'weight');
const entType = (en) => en.type || exType(exById(en.exId) || { name: en.name || '' });
const TYPE_NAMES = { weight: 'Weights (kg × reps)', bw: 'Bodyweight (reps)', timed: 'Timed hold (seconds)' };
const typeOptions = (sel) => Object.keys(TYPE_NAMES).map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${TYPE_NAMES[k]}</option>`).join('');
function parseSec(txt) {
  if (!txt) return 0;
  const m = String(txt).match(/(\d+(?:\.\d+)?)/); if (!m) return 0;
  const n = parseFloat(m[1]);
  return /min/i.test(txt) ? Math.round(n * 60) : /sec/i.test(txt) ? Math.round(n) : 0;
}
const setLong = (x) => x.s ? x.s + ' sec' : x.w ? x.w + ' kg × ' + x.r : x.r + ' reps';
const setShort = (x) => x.s ? x.s + 's' : x.w ? x.w + '×' + x.r : x.r + ' reps';

let toastT;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3500);
}

  "The weight won't lift itself. Neither will your future.",

  "Small sets, big habits.",

  "The pain of discipline is lighter than the pain of regret.",
  "Don't wish for it. Rep for it.",
  "You showed up. That's already the hardest set.",
  "Be a little stronger than you were yesterday."
];
function pickQuote() {
  let last = parseInt(localStorage.getItem('repforge.q'), 10);
  let i;
  do { i = Math.floor(Math.random() * QUOTES.length); } while (i === last && QUOTES.length > 1);
  try { localStorage.setItem('repforge.q', i); } catch (e) {}
  return i;
}
let quoteIdx = 0;
try { quoteIdx = pickQuote(); } catch (e) { quoteIdx = Math.floor(Math.random() * QUOTES.length); }

/* ---------- YOUR WEEKLY PLAN: Muscle Gain + Recomp ----------
   [exercise name, sets, reps/time]   (index 0 = Monday ... 6 = Sunday)  */
const MY_PLAN = [
  ['Upper A + Core', [
    ['Dumbbell Floor Press', 4, '8–12'], ['Dumbbell Floor Fly', 3, '10–15'],
    ['Pull-ups', 3, 'near failure'], ['One-arm Dumbbell Row', 3, '10–12 each side'],

  ['Arms + Forearms', [

    ['Overhead Dumbbell Extension', 3, '10–12'], ['Close-Grip Push-ups', 3, 'near failure'],
    ['Dumbbell Kickbacks', 2, '12–15'], ['Dumbbell Wrist Curl', 3, '15–20'],
    ['Reverse Wrist Curl', 3, '15–20'], ['Dead Hang', 2, 'near failure']]],
  ['Full Body Mobility', [
    ['Cat-Cow', 2, '10'], ["World's Greatest Stretch", 1, '5 each side'], ['Deep Squat Hold', 1, '1 min'],
    ['Shoulder Dislocates (towel)', 2, '15'], ['Glute Bridges', 2, '15'],
    ['Side Plank', 1, '30–45 sec each side'], ['Forward Fold', 1, '1 min'],
    ['90/90 Hip Rotations', 2, '8 each side'], ['Ankle Mobility Rocks', 2, '15 each side'],
    ['Thoracic Rotations', 2, '10 each side']]],

const normPlan = (p) => {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = (p && p.days && p.days[i]) || {};
    days.push({ on: !!d.on, name: d.name || '', ex: Array.isArray(d.ex) ? d.ex : [],
      cfg: d.cfg && typeof d.cfg === 'object' ? d.cfg : {} });
  }
  return { days };
};
const normProfile = (p) => {
  p = p || {};
  return { height: p.height || null, weight: p.weight || null, weights: Array.isArray(p.weights) ? p.weights : [] };
};
const emptyState = () => ({ exercises: [], sessions: [], active: null, plan: normPlan(), profile: normProfile() });

/* builds the plan, creating any missing exercises inside the given array */
function buildMyPlan(exercises) {
  const byName = new Map(exercises.map(e => [e.name.toLowerCase(), e]));
  const days = MY_PLAN.map(p => {
    if (!p) return { on: false, name: '', ex: [], cfg: {} };
    const ex = [], cfg = {};
    p[1].forEach(([name, sets, reps]) => {
      let e = byName.get(name.toLowerCase());
      if (!e) { e = { id: uid(), name, rest: DEF_REST, restEx: DEF_REST_EX }; exercises.push(e); byName.set(name.toLowerCase(), e); }
      if (!ex.includes(e.id)) { ex.push(e.id); cfg[e.id] = { sets, reps }; }
    });
    return { on: true, name: p[0], ex, cfg };
  });
  return { days };
}
const freshState = () => { const ex = []; const plan = buildMyPlan(ex); return { ...emptyState(), exercises: ex, plan }; };

/* ---------- guest storage ---------- */
function loadGuest() {

        plan: normPlan(d.plan), profile: normProfile(d.profile) };

}

/* ---------- sync status ---------- */
function setStatus() {

  if (!user) { el.textContent = 'On this device'; return; }
  el.textContent = !navigator.onLine ? 'Offline · will sync' : pending > 0 ? 'Syncing…' : 'Synced';
}
function track(p) {
  pending++; setStatus();
  p.then(() => { pending--; setStatus(); })
   .catch(e => { pending--; console.error(e); $('#saveStatus').textContent = 'Sync error'; });
}
window.addEventListener('online', setStatus);

/* ---------- saving ---------- */
const metaRef = () => doc(db, 'users', user.uid, 'meta', 'state');
const sessCol = () => collection(db, 'users', user.uid, 'sessions');
const sessRef = (id) => doc(db, 'users', user.uid, 'sessions', id);

function persist() {                       // exercises, plan, profile, active workout
  if (!user) { saveGuest(); return; }
  if (!ready.meta) return;
  clearTimeout(metaTimer);
  metaTimer = setTimeout(flushMeta, 500);
}
function flushMeta() {
  if (metaTimer === null) return;
  clearTimeout(metaTimer); metaTimer = null;
  if (!user) return;
  track(setDoc(metaRef(), { exercises: state.exercises, active: state.active || null, plan: state.plan, profile: state.profile, updatedAt: Date.now() }));
}
function saveSession(s) { if (!user) { saveGuest(); return; } track(setDoc(sessRef(s.id), s)); }
function removeSession(id) { if (!user) { saveGuest(); return; } track(deleteDoc(sessRef(id))); }
function replaceSessions(oldList, newList) {
  if (!user) { saveGuest(); return; }
  const ops = [...oldList.map(s => ({ del: s.id })), ...newList.map(s => ({ set: s }))];
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(o => o.del ? b.delete(sessRef(o.del)) : b.set(sessRef(o.set.id), o.set));
    track(b.commit());

}
window.addEventListener('pagehide', flushMeta);

/* ---------- live sync (signed in) ---------- */
function startSync() {
  unsubs.push(onSnapshot(metaRef(), snap => {
    if (!snap.exists()) {
      if (snap.metadata.fromCache) return;          // wait for the server's answer
      initAccount(); return;
    }
    if (ready.meta && (snap.metadata.hasPendingWrites || metaTimer !== null)) return;   // our own edits
    const d = snap.data();
    state.exercises = d.exercises || [];
    state.active = d.active || null;
    state.plan = normPlan(d.plan);
    state.profile = normProfile(d.profile);
    ready.meta = true; refresh();
  }, fail));
  unsubs.push(onSnapshot(query(sessCol(), orderBy('date')), snap => {
    state.sessions = snap.docs.map(x => x.data());
    ready.sessions = true; refresh();
  }, fail));
}

function initAccount() {                              // brand-new account: start from device data or defaults
  if (initializing) return; initializing = true;
  const g = loadGuest();
  const base = g || freshState();
  state.exercises = base.exercises; state.active = base.active; state.plan = base.plan; state.profile = base.profile;
  ready.meta = true;
  track(setDoc(metaRef(), { exercises: state.exercises, active: state.active || null, plan: state.plan, profile: state.profile, updatedAt: Date.now() }));
  if (g) {
    g.sessions.forEach(s => { if (s && s.id) saveSession(s); });
    try { localStorage.removeItem(GUEST_KEY); } catch (e) {}
  }
  refresh();
}

function mergeGuest(g) {                              // existing account + data on this device
  const idMap = {};
  const byName = new Map(state.exercises.map(e => [e.name.toLowerCase(), e.id]));
  g.exercises.forEach(e => {
    const k = e.name.toLowerCase();
    if (byName.has(k)) idMap[e.id] = byName.get(k);
    else { state.exercises.push(e); byName.set(k, e.id); }
  });
  const rm = (id) => idMap[id] || id;
  const have = new Set(state.sessions.map(s => s.id));
  g.sessions.forEach(s => {
    if (have.has(s.id)) return;
    const s2 = { ...s, entries: s.entries.map(en => ({ ...en, exId: rm(en.exId) })) };
    state.sessions.push(s2); saveSession(s2);
  });
  state.sessions.sort((a, b) => a.date - b.date);
  if (!state.active && g.active) state.active = { ...g.active, entries: g.active.entries.map(en => ({ ...en, exId: rm(en.exId) })) };
  if (!state.plan.days.some(d => d.on || d.ex.length)) {
    state.plan = { days: g.plan.days.map(d => ({ ...d, ex: d.ex.map(rm),
      cfg: Object.fromEntries(Object.entries(d.cfg || {}).map(([k, v]) => [rm(k), v])) })) };
  }
  const p = state.profile, gp = g.profile;
  if (!p.height && gp.height) p.height = gp.height;
  if (!p.weight && gp.weight) p.weight = gp.weight;
  const seen = new Set(p.weights.map(x => x.d));
  gp.weights.forEach(x => { if (!seen.has(x.d)) p.weights.push(x); });
  p.weights.sort((a, b) => a.d < b.d ? -1 : 1);
  persist();
}
function afterCloudReady() {
  const g = loadGuest();
  if (!meaningful(g) || guestAsked) return;

  if (confirm('You have workouts/plans saved on this device.\n\nAdd them to your account?\n\nOK = add to account\nCancel = leave them on this device only')) {
    mergeGuest(g);

}

function fail(err) {

function refresh() {

function lastSet(exId) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const en = state.sessions[i].entries.find(e => e.exId === exId && e.sets.length);
    if (en) return { ...en.sets[en.sets.length - 1], date: state.sessions[i].date };
  }
  return null;
}
function bestWeight(exId) {
  let best = 0;
  state.sessions.forEach(s => s.entries.forEach(e => { if (e.exId === exId) e.sets.forEach(x => { if (x.w > best) best = x.w; }); }));
  if (state.active) state.active.entries.forEach(e => { if (e.exId === exId) e.sets.forEach(x => { if (x.w > best) best = x.w; }); });
  return best;
}
function makeEntry(id, c) {
  const ex = exById(id), p = lastSet(id), ty = exType(ex);
  const en = { exId: id, name: ex.name, type: ty, w: p ? p.w : (ty === 'weight' ? 20 : 0), r: p && p.r ? p.r : 10, sets: [] };
  if (ty === 'timed') en.t = parseSec(c && c.reps) || (p && p.s) || 30;
  if (c && c.sets) { en.target = c.sets; en.repsTxt = c.reps || ''; }
  return en;
}
function startWorkout(ids, label, cfg) {
  state.active = { id: uid(), start: Date.now(), label: label || '', entries: ids.filter(exById).map(id => makeEntry(id, cfg && cfg[id])) };

function weekStreak() {
  const weeks = new Set(state.sessions.map(s => mondayOf(s.date)));
  let k = mondayOf(Date.now());
  if (!weeks.has(k)) k = mondayOf(addDays(k, -7));
  let n = 0;
  while (weeks.has(k)) { n++; k = mondayOf(addDays(k, -7)); }
  return n;
}
const bmiOf = (h, w) => w / Math.pow(h / 100, 2);

}

function weightChart(ws) {
  if (ws.length < 2) return '<div class="muted">Save your weight on a few different days to see your trend here.</div>';
  const a = ws.slice(-30), W = 300, H = 110, P = 14;
  const vals = a.map(x => x.w);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  let mn = lo, mx = hi; if (mx - mn < 1) { mx += 0.5; mn -= 0.5; }
  const x = (i) => P + (W - 2 * P) * (i / (a.length - 1));
  const y = (v) => H - P - (H - 2 * P) * ((v - mn) / (mx - mn));
  const pts = a.map((p, i) => x(i).toFixed(1) + ',' + y(p.w).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${a.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join('')}
    <text x="${P}" y="${H - 1}" font-size="9" fill="var(--muted)">${a[0].d}</text>
    <text x="${W - P}" y="${H - 1}" font-size="9" fill="var(--muted)" text-anchor="end">${a[a.length - 1].d}</text></svg>
    <div class="muted">Range ${lo} – ${hi} kg</div>`;
}

/* ---------- rest timer ---------- */
function restLabelText(r) {
  const n = exById(r.exId)?.name || '';
  return (r.mode === 'hold' ? 'Hold · ' : r.mode === 'ex' ? 'Rest before next exercise · ' : 'Rest between sets · ') + n;
}
function startRest(seconds, exId, mode) {
  if (seconds <= 0) return;
  rest = { end: Date.now() + seconds * 1000, total: seconds, exId, mode: mode || 'set', done: false };
  $('#restbar').classList.add('show');
  $('#restbar').classList.remove('done');
  $('#restLabel').textContent = restLabelText(rest);
  clearInterval(timerId);
  timerId = setInterval(tick, 250);
  tick();
}
function tick() {
  if (!rest) return;
  const left = (rest.end - Date.now()) / 1000;
  $('#restTime').textContent = fmt(left);
  $('#restProg').style.width = Math.max(0, Math.min(100, left / rest.total * 100)) + '%';
  const c = Math.ceil(left);
  if (!rest.done && c >= 1 && c <= 3 && rest.lastC !== c) { rest.lastC = c; shortBeep(); }   // 3-2-1 countdown beeps
  if (left <= 0 && !rest.done) {
    if (rest.mode === 'hold') { finishHold(); return; }
    rest.done = true;
    $('#restbar').classList.add('done');
    $('#restLabel').textContent = rest.mode === 'ex' ? 'Rest over — next exercise!' : 'Rest over — next set!';
    beep(); if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 500]);
    setTimeout(() => { if (rest && rest.done) stopRest(); }, 8000);
  }
}
function stopRest() { rest = null; clearInterval(timerId); $('#restbar').classList.remove('show'); }

function shortBeep() {
  try {
    unlockAudio(); if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.frequency.value = 700; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.17);
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) {}
}

/* hold timer finished -> long beep, log the set automatically, start the normal rest */
function finishHold() {
  const r = rest;
  const en = state.active && state.active.entries.find(x => x.exId === r.exId);
  beep(); if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 500]);
  stopRest();
  if (en) logSet(en, { w: 0, r: 0, s: Math.round(r.total) });
}

/* logs one set, auto-ticks the exercise after its last set, starts the right rest */
function logSet(en, set) {
  const ex = exById(en.exId);
  const best = set.s ? 0 : bestWeight(en.exId);
  en.sets.push({ ...set, t: Date.now() });
  const last = en.target && en.sets.length === en.target;
  if (last) {
    en.done = true;
    const nx = state.active.entries.find(x => !x.done && x !== en);
    openEx = nx ? nx.exId : null;
  }
  const pr = best > 0 && set.w > best;
  if (pr) { const a = state.active; a.prs = a.prs || []; if (!a.prs.includes(ex.name)) a.prs.push(ex.name); }
  persist(); render();
  if (last) window.scrollTo(0, 0);
  if (last) startRest(exRest(ex), en.exId, 'ex'); else startRest(ex.rest, en.exId, 'set');
  if (pr) toast('🏆 New PR on ' + ex.name + ': ' + set.w + ' kg');
}

let audioCtx;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
function beep() {
  try {
    unlockAudio(); if (!audioCtx) return;
    [0, 0.25, 0.5].forEach((t, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i === 2 ? 1100 : 800; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.22);
    });
  } catch (e) {}
}
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (state.active) keepAwake(true); tick(); }
});

/* ---------- plan helpers ---------- */
function addToDay(d, id) {
  if (!d.ex.includes(id)) d.ex.push(id);
  d.cfg = d.cfg || {};
  if (!d.cfg[id]) d.cfg[id] = { sets: 3, reps: '' };
}

/* ---------- actions ---------- */
function entryOf(el) {
  const card = el.closest('[data-ex]'); if (!card || !state.active) return [null, null];
  return [state.active.entries.find(e => e.exId === card.dataset.ex), card];
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#menuBtn')) { toggleMenu(); return; }
  if (!e.target.closest('#menu')) closeMenu();
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.closest('#menu')) closeMenu();
  unlockAudio();
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const act = t.dataset.act;

  /* account + app */
  if (act === 'login') {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider).catch(err => {
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') return signInWithRedirect(auth, provider);
      if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
      toast('Sign-in failed: ' + (err.code || err.message));
    });
  }
  else if (act === 'logout') {
    if (!confirm('Sign out? Your data stays safe in your account.')) return;
    flushMeta(); setTimeout(() => signOut(auth), 300);
  }
  else if (act === 'help-install') showHelp('install');
  else if (act === 'help-use') showHelp('use');
  else if (act === 'theme') applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  else if (act === 'export') {
    const data = { exercises: state.exercises, sessions: state.sessions, plan: state.plan, profile: state.profile };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'repforge-backup-' + dateStr() + '.json'; a.click();
  }
  else if (act === 'import') $('#importFile').click();
  else if (act === 'install') { const p = window.__ip; if (p) { window.__ip = null; p.prompt(); } }

  /* home */
  else if (act === 'quote') { quoteIdx = pickQuote(); render(); }
  else if (act === 'goto-plan') { planSel = todayIdx(); tab = 'plan'; render(); window.scrollTo(0, 0); }
  else if (act === 'quick-start') {
    if (!state.active) startWorkout([], '');
    tab = 'workout'; render(); window.scrollTo(0, 0);
  }
  else if (act === 'start-plan') {
    const i = +t.dataset.i, d = state.plan.days[i];
    startWorkout(d.ex, d.name || FULL[i], d.cfg); tab = 'workout'; render(); window.scrollTo(0, 0);
  }
  else if (act === 'start-plan-sel') {
    const i = +$('#planSelStart').value, d = state.plan.days[i];
    startWorkout(d.ex, d.name || FULL[i], d.cfg); render();
  }

  /* workout */
  else if (act === 'start') { startWorkout([], ''); render(); }
  else if (act === 'add-entry') {
    const id = $('#addExSel').value; if (!id) return;
    state.active.entries.push(makeEntry(id));
    openEx = id;
    persist(); render();
  }
  else if (act === 'remove-entry') {
    const [en] = entryOf(t);
    if (en.sets.length && !confirm('Remove this exercise and its logged sets?')) return;
    state.active.entries = state.active.entries.filter(x => x !== en); persist(); render();
  }
  else if (act === 'open-ex') {
    const [en] = entryOf(t); openEx = en.exId; render();
    const el = document.querySelector('[data-ex="' + en.exId + '"]'); if (el) el.scrollIntoView({ block: 'start' });
  }
  else if (act === 'close-ex') { openEx = null; render(); }
  else if (act === 'close-summary') $('#summary').classList.add('hidden');
  else if (act === 'hold-start') {
    const [en, card] = entryOf(t); const ex = exById(en.exId);
    const rIn = card.querySelector('input[data-f="rest"]'), xIn = card.querySelector('input[data-f="restEx"]');
    if (rIn) ex.rest = Math.max(5, num(rIn.value, ex.rest));
    if (xIn) ex.restEx = Math.max(5, num(xIn.value, exRest(ex)));
    const secs = num(en.t, 30);
    if (secs <= 0) { toast('Enter seconds first'); return; }
    startRest(secs, en.exId, 'hold');
  }
  else if (act === 'toggle-done') {
    const [en] = entryOf(t); en.done = !en.done; persist(); render();
  }
  else if (act === 'step') {
    const [en, card] = entryOf(t); const f = t.dataset.f;
    en[f] = Math.max(0, Math.round((num(en[f], f === 't' ? 30 : 0) + num(t.dataset.d)) * 10) / 10);
    card.querySelector(`input[data-f="${f}"]`).value = en[f]; persist();
  }
  else if (act === 'log') {
    const [en, card] = entryOf(t); const ex = exById(en.exId);
    const timed = entType(en) === 'timed';
    if (timed ? num(en.t, 30) <= 0 : num(en.r) <= 0) { toast(timed ? 'Enter seconds first' : 'Enter reps first'); return; }
    // pick up rest values typed but not yet committed
    const rIn = card.querySelector('input[data-f="rest"]'), xIn = card.querySelector('input[data-f="restEx"]');
    if (rIn) ex.rest = Math.max(5, num(rIn.value, ex.rest));
    if (xIn) ex.restEx = Math.max(5, num(xIn.value, exRest(ex)));
    logSet(en, timed ? { w: 0, r: 0, s: num(en.t, 30) } : { w: num(en.w), r: num(en.r) });
  }
  else if (act === 'del-set') {
    const [en] = entryOf(t); en.sets.splice(+t.dataset.i, 1);
    if (en.target && en.sets.length < en.target) en.done = false;
    persist(); render();
  }
  else if (act === 'finish') {
    const a = state.active;
    const entries = a.entries.filter(x => x.sets.length).map(x => ({ exId: x.exId, name: x.name, sets: x.sets }));
    if (!entries.length) { if (confirm('No sets logged. Discard this workout?')) { state.active = null; persist(); stopRest(); keepAwake(false); render(); } return; }
    const left = a.entries.filter(x => x.target && !x.done).length;
    if (left && !confirm(left + ' planned exercise(s) not marked done. Finish workout anyway?')) return;
    const s = { id: a.id, date: a.start, label: a.label || '', duration: Math.max(1, Math.round((Date.now() - a.start) / 60000)), entries };
    state.sessions.push(s); saveSession(s);
    const prs = a.prs || [];
    state.active = null; persist(); stopRest(); keepAwake(false); tab = 'history'; render();
    showSummary(s, prs);
  }
  else if (act === 'discard') {
    if (confirm('Discard this workout? Logged sets will be lost.')) { state.active = null; persist(); stopRest(); keepAwake(false); render(); }
  }
  else if (act === 'rest-adj') { if (rest) { rest.end += num(t.dataset.d) * 1000; rest.total = Math.max(rest.total, (rest.end - Date.now()) / 1000); if (rest.done && rest.end > Date.now()) { rest.done = false; $('#restbar').classList.remove('done'); $('#restLabel').textContent = restLabelText(rest); } tick(); } }
  else if (act === 'rest-skip') stopRest();

  /* plan */
  else if (act === 'plan-days') {
    const PRESETS = { 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 3, 4], 6: [0, 1, 2, 3, 4, 5] };
    const on = new Set(PRESETS[+t.dataset.n]);
    state.plan.days.forEach((d, i) => { d.on = on.has(i); });
    if (!state.plan.days[planSel].on) { const f = state.plan.days.findIndex(d => d.on); if (f >= 0) planSel = f; }
    persist(); render();
  }
  else if (act === 'plan-load-mine') {
    if (state.plan.days.some(d => d.ex.length) && !confirm('This replaces your current weekly plan with the Muscle Gain + Recomp plan (Mon–Sat). Your exercises and history are kept. Continue?')) return;
    state.plan = buildMyPlan(state.exercises);
    persist(); render(); toast('Plan loaded');
  }
  else if (act === 'plan-day') { planSel = +t.dataset.i; render(); }
  else if (act === 'plan-toggle') { const d = state.plan.days[planSel]; d.on = !d.on; persist(); render(); }
  else if (act === 'plan-add') {
    const id = $('#dayAddSel').value; if (!id) return;
    addToDay(state.plan.days[planSel], id); persist(); render();
  }
  else if (act === 'plan-create') {
    const name = $('#dayNewEx').value.trim(); if (!name) { $('#dayNewEx').focus(); return; }
    let ex = state.exercises.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!ex) { ex = { id: uid(), name, rest: DEF_REST, restEx: DEF_REST_EX }; state.exercises.push(ex); }
    addToDay(state.plan.days[planSel], ex.id);
    persist(); render();
  }
  else if (act === 'pex-up' || act === 'pex-down') {
    const arr = state.plan.days[planSel].ex, k = +t.dataset.k, j = act === 'pex-up' ? k - 1 : k + 1;
    if (j < 0 || j >= arr.length) return;
    [arr[k], arr[j]] = [arr[j], arr[k]]; persist(); render();
  }
  else if (act === 'pex-del') {
    const d = state.plan.days[planSel], id = d.ex[+t.dataset.k];
    d.ex.splice(+t.dataset.k, 1); if (d.cfg) delete d.cfg[id];
    persist(); render();
  }
  else if (act === 'plan-clear') {
    if (confirm('Remove all exercises from ' + FULL[planSel] + '?')) { const d = state.plan.days[planSel]; d.ex = []; d.cfg = {}; d.name = ''; persist(); render(); }
  }
  else if (act === 'rest-preset') $('#newRest').value = t.dataset.s;
  else if (act === 'add-ex') {
    const name = $('#newName').value.trim(); if (!name) { $('#newName').focus(); return; }
    if (state.exercises.some(x => x.name.toLowerCase() === name.toLowerCase())) { toast('That exercise already exists'); return; }
    state.exercises.push({ id: uid(), name, type: $('#newType').value, rest: Math.max(5, num($('#newRest').value, DEF_REST)), restEx: Math.max(5, num($('#newRestEx').value, DEF_REST_EX)) });
    persist(); render(); toast('Exercise added');
  }
  else if (act === 'del-ex') {
    const id = t.closest('[data-id]').dataset.id;
    if (confirm('Delete this exercise? Past history keeps its name.')) {
      state.exercises = state.exercises.filter(x => x.id !== id);
      state.plan.days.forEach(d => { d.ex = d.ex.filter(x => x !== id); if (d.cfg) delete d.cfg[id]; });
      persist(); render();
    }
  }

  /* history + body */
  else if (act === 'del-session') {
    const id = t.closest('[data-sid]').dataset.sid;
    if (confirm('Delete this workout from history?')) { state.sessions = state.sessions.filter(s => s.id !== id); removeSession(id); render(); }
  }
  else if (act === 'save-body') {
    const h = num($('#hIn').value), w = num($('#wIn').value);
    if (h < 100 || h > 250) { toast('Enter height in cm (100–250)'); return; }
    if (w < 20 || w > 300) { toast('Enter weight in kg (20–300)'); return; }
    const p = state.profile; p.height = h; p.weight = w;
    const d = dateStr(), ex = p.weights.find(x => x.d === d);
    if (ex) ex.w = w; else p.weights.push({ d, w });
    p.weights.sort((a, b) => a.d < b.d ? -1 : 1);
    persist(); render(); toast('Saved');
  }
  else if (act === 'del-weight') {
    const p = state.profile; p.weights = p.weights.filter(x => x.d !== t.dataset.d); persist(); render();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'importFile') {
    const f = t.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.exercises) || !Array.isArray(d.sessions)) throw 0;
        if (!confirm('Replace current data with this backup?')) return;
        const oldList = state.sessions;
        const newList = d.sessions.map(s => ({ ...s, id: s.id || uid() }));
        state.exercises = d.exercises; state.sessions = newList; state.active = null;
        state.plan = normPlan(d.plan); state.profile = normProfile(d.profile);
        persist(); replaceSessions(oldList, newList); render(); toast('Backup restored');
      } catch (x) { toast('That file is not a valid backup.'); }
      t.value = '';
    };
    r.readAsText(f); return;
  }
  const f = t.dataset.f; if (!f) return;
  if (f === 'planname') { state.plan.days[planSel].name = t.value.trim(); persist(); return; }
  if (f === 'psets' || f === 'preps') {                 // sets / reps target for an exercise on the selected day
    const d = state.plan.days[planSel]; d.cfg = d.cfg || {};
    const c = d.cfg[t.dataset.id] = d.cfg[t.dataset.id] || { sets: 3, reps: '' };
    if (f === 'psets') { c.sets = Math.max(1, Math.round(num(t.value, 3))); t.value = c.sets; }
    else c.reps = t.value.trim();
    persist(); return;
  }
  const [en] = entryOf(t);
  if (en) {                                   // inside a workout card
    const ex = exById(en.exId);
    if (f === 'rest') { ex.rest = Math.max(5, num(t.value, ex.rest)); t.value = ex.rest; }
    else if (f === 'restEx') { ex.restEx = Math.max(5, num(t.value, exRest(ex))); t.value = ex.restEx; }
    else en[f] = Math.max(0, num(t.value));
    persist(); return;
  }
  const row = t.closest('[data-id]');         // exercise list
  if (row) {
    const ex = exById(row.dataset.id);
    if (f === 'name') { const v = t.value.trim(); if (v) ex.name = v; else t.value = ex.name; }
    if (f === 'rest') { ex.rest = Math.max(5, num(t.value, ex.rest)); t.value = ex.rest; }
    if (f === 'restEx') { ex.restEx = Math.max(5, num(t.value, exRest(ex))); t.value = ex.restEx; }
    if (f === 'type') ex.type = t.value;
    persist();
  }
});

/* theme */
function applyTheme(th) { document.documentElement.dataset.theme = th; try { localStorage.setItem('repforge.theme', th); } catch (e) {} }
try { applyTheme(localStorage.getItem('repforge.theme') || 'dark'); } catch (e) { applyTheme('dark'); }

render();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
