<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Lift Log</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
  --text:#eef0f4; --muted:#8b93a3; --accent:#ff6b2c; --accent-ink:#1a0d05;
  --ok:#3ddc97; --danger:#ff5d6c;
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --card:#ffffff; --card2:#eef0f4; --line:#dde1e8;
  --text:#14171c; --muted:#677084; --accent:#e8530e; --accent-ink:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;
  border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;letter-spacing:.3px}
header h1 span{color:var(--accent)}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:12px 4px;
  font-size:13px;cursor:pointer}
.tabs button b{display:block;font-size:20px;font-weight:400}
.tabs button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:16px;margin:0}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;
  padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
button.danger{color:var(--danger)}
input,select{background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:11px;font-size:16px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.stepper{display:flex;align-items:stretch;gap:6px}
.stepper button{width:44px;background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;font-size:22px;cursor:pointer}
.stepper input{text-align:center;font-weight:700;font-size:20px;padding:8px 2px}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.set{display:flex;justify-content:space-between;align-items:center;background:var(--card2);
  border-radius:10px;padding:8px 12px;font-size:15px}
.set .n{color:var(--muted);width:28px}
.set button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));
  max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--accent);
  border-radius:16px;padding:12px 14px;z-index:7;display:none}
.restbar.show{display:block}
.restbar.done{border-color:var(--ok)}
.restbar .time{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.progress{height:6px;background:var(--card2);border-radius:99px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.restbar.done .progress i{background:var(--ok)}
.ex-item{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:end;margin-bottom:10px}
.hist-ex{margin-top:8px;font-size:14px}
.hist-ex b{display:block}
.hidden{display:none!important}
.status{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>Lift<span>Log</span></h1>
  <div class="row">
    <span class="status" id="saveStatus"></span>
    <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
    <button class="icon-btn hidden" id="logoutBtn" title="Sign out">⎋</button>
  </div>
</header>

<main id="view"></main>

<div class="restbar" id="restbar">
  <div class="row between">
    <div>
      <div class="muted" id="restLabel">Rest</div>
      <div class="time" id="restTime">0:00</div>
    </div>
    <div class="row">
      <button class="ghost" data-act="rest-adj" data-d="-15">−15s</button>
      <button class="ghost" data-act="rest-adj" data-d="15">+15s</button>
      <button class="ghost" data-act="rest-skip">Skip</button>
    </div>
  </div>
  <div class="progress"><i id="restProg"></i></div>
</div>

<nav class="tabs hidden" id="tabs">
  <button data-tab="workout"><b>🏋️</b>Workout</button>
  <button data-tab="exercises"><b>📋</b>Exercises</button>
  <button data-tab="history"><b>📈</b>History</button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, collection, query, orderBy, onSnapshot, setDoc, deleteDoc, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* =====================================================================
   FIREBASE
   Data layout in Firestore:
     users/{uid}/meta/state      -> { exercises, active, updatedAt }
     users/{uid}/sessions/{id}   -> one finished workout per document
   Offline: Firestore keeps a local cache, so logging works without net
   and syncs automatically when the connection returns.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB0OKzT7-bpoVSSlQtMP1P51U-ZC_vUHcw",
  authDomain: "workout-lift-log.firebaseapp.com",
  projectId: "workout-lift-log",
  storageBucket: "workout-lift-log.firebasestorage.app",
  messagingSenderId: "1085511970911",
  appId: "1:1085511970911:web:68ad123861823a5cd46bea"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try {
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) { db = getFirestore(app); }

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtRest = (s) => s >= 60 ? (s % 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : (s / 60) + ' min') : s + ' sec';
const num = (v, d = 0) => { const n = parseFloat(v); return isNaN(n) ? d : n; };

/* ---------- state ---------- */
const DEFAULT_EXERCISES = [
  ['Bench Press', 120], ['Squat', 180], ['Deadlift', 180], ['Overhead Press', 120],
  ['Barbell Row', 120], ['Pull-ups', 90], ['Bicep Curl', 60], ['Tricep Pushdown', 60]
].map(([name, rest]) => ({ id: uid(), name, rest }));

let user = null;
let state = { exercises: [], sessions: [], active: null };
let ready = { meta: false, sessions: false };
let unsubs = [];
let metaTimer = null;
let initializing = false;
let shown = false;
let pending = 0;
let tab = 'workout';
let rest = null;        // {end, total, exId, done}
let timerId = null;
let wakeLock = null;

const exById = (id) => state.exercises.find(e => e.id === id);

/* ---------- sync status ---------- */
function setStatus() {
  const el = $('#saveStatus');
  if (!user) { el.textContent = ''; return; }
  el.textContent = !navigator.onLine ? 'Offline · will sync' : pending > 0 ? 'Syncing…' : 'Synced';
}
function track(p) {
  pending++; setStatus();
  p.then(() => { pending--; setStatus(); })
   .catch(e => { pending--; console.error(e); $('#saveStatus').textContent = 'Sync error'; });
}
window.addEventListener('online', setStatus);
window.addEventListener('offline', setStatus);

/* ---------- Firestore writes ---------- */
const metaRef = () => doc(db, 'users', user.uid, 'meta', 'state');
const sessCol = () => collection(db, 'users', user.uid, 'sessions');
const sessRef = (id) => doc(db, 'users', user.uid, 'sessions', id);

function persist() {                       // exercises + active workout (debounced)
  if (!user || !ready.meta) return;
  clearTimeout(metaTimer);
  metaTimer = setTimeout(flushMeta, 500);
}
function flushMeta() {
  if (metaTimer === null) return;
  clearTimeout(metaTimer); metaTimer = null;
  if (!user) return;
  track(setDoc(metaRef(), { exercises: state.exercises, active: state.active || null, updatedAt: Date.now() }));
}
function saveSession(s) { track(setDoc(sessRef(s.id), s)); }
function removeSession(id) { track(deleteDoc(sessRef(id))); }
function replaceSessions(oldList, newList) {
  const ops = [...oldList.map(s => ({ del: s.id })), ...newList.map(s => ({ set: s }))];
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(o => o.del ? b.delete(sessRef(o.del)) : b.set(sessRef(o.set.id), o.set));
    track(b.commit());
  }
}
window.addEventListener('pagehide', flushMeta);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushMeta(); });

/* ---------- live sync ---------- */
function startSync() {
  unsubs.push(onSnapshot(metaRef(), snap => {
    if (!snap.exists()) {
      if (snap.metadata.fromCache) return;          // wait for the server's answer
      initAccount(); return;
    }
    if (ready.meta && (snap.metadata.hasPendingWrites || metaTimer !== null)) return;   // our own edits
    const d = snap.data();
    state.exercises = d.exercises || [];
    state.active = d.active || null;
    ready.meta = true; refresh();
  }, fail));
  unsubs.push(onSnapshot(query(sessCol(), orderBy('date')), snap => {
    state.sessions = snap.docs.map(x => x.data());
    ready.sessions = true; refresh();
  }, fail));
}

function initAccount() {                              // first login: migrate old on-device data or seed defaults
  if (initializing) return; initializing = true;
  let legacy = null;
  try { const l = JSON.parse(localStorage.getItem('liftlog.v1')); if (l && Array.isArray(l.exercises)) legacy = l; } catch (e) {}
  state.exercises = legacy ? legacy.exercises : DEFAULT_EXERCISES;
  state.active = legacy ? (legacy.active || null) : null;
  ready.meta = true;
  track(setDoc(metaRef(), { exercises: state.exercises, active: state.active, updatedAt: Date.now() }));
  if (legacy && Array.isArray(legacy.sessions)) legacy.sessions.forEach(s => { if (s && s.id) saveSession(s); });
  if (legacy) { try { localStorage.removeItem('liftlog.v1'); } catch (e) {} }
  refresh();
}

function fail(err) {
  console.error(err);
  $('#view').innerHTML = `<div class="card"><h2>Couldn't load your data</h2>
    <p class="muted">${esc(err.code || err.message || 'Unknown error')}</p>
    <p class="muted">Check that Firestore is created and the security rules are published, then reload the page.</p></div>`;
}

function refresh() {
  const a = document.activeElement;
  const typing = a && a.matches && a.matches('input,select,textarea');
  if (shown && typing) return;                        // don't wipe what the user is typing
  const wasShown = shown;
  shown = ready.meta && ready.sessions;
  if (shown && !wasShown && state.active) keepAwake(true);
  render();
}

/* ---------- auth ---------- */
onAuthStateChanged(auth, (u) => {
  unsubs.forEach(f => f()); unsubs = [];
  clearTimeout(metaTimer); metaTimer = null;
  user = u;
  state = { exercises: [], sessions: [], active: null };
  ready = { meta: false, sessions: false };
  shown = false; initializing = false; tab = 'workout';
  stopRest(); keepAwake(false);
  if (u) startSync();
  render(); setStatus();
});

function lastSet(exId) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const en = state.sessions[i].entries.find(e => e.exId === exId && e.sets.length);
    if (en) return { ...en.sets[en.sets.length - 1], date: state.sessions[i].date };
  }
  return null;
}

/* ---------- views ---------- */
function render() {
  const loggedIn = !!user;
  $('#tabs').classList.toggle('hidden', !loggedIn);
  $('#logoutBtn').classList.toggle('hidden', !loggedIn);
  const v = $('#view');
  if (!loggedIn) { v.innerHTML = viewLogin(); return; }
  if (!(ready.meta && ready.sessions)) { v.innerHTML = '<div class="empty">Loading your workouts…<br><span class="muted">First time needs internet.</span></div>'; return; }
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'workout') v.innerHTML = viewWorkout();
  else if (tab === 'exercises') v.innerHTML = viewExercises();
  else v.innerHTML = viewHistory();
}

function viewLogin() {
  return `<div class="card" style="margin-top:40px;text-align:center">
    <h2>Welcome to LiftLog</h2>
    <p class="muted">Sign in to save your workouts and use them on any device.</p>
    <button class="primary" data-act="login">Continue with Google</button>
    <div id="loginErr" class="muted" style="margin-top:12px;color:var(--danger)"></div>
  </div>`;
}

function viewWorkout() {
  const a = state.active;
  if (!a) {
    return `<div class="card">
      <h2>Ready to train?</h2>
      <p class="muted">Start a workout, pick your exercises, log each set and let the timer handle your rest.</p>
      <button class="primary" data-act="start">Start workout</button>
    </div>` + (state.sessions.length ? `<div class="muted" style="text-align:center">Last workout: ${new Date(state.sessions[state.sessions.length-1].date).toLocaleDateString()}</div>` : '');
  }
  const used = new Set(a.entries.map(e => e.exId));
  const avail = state.exercises.filter(e => !used.has(e.id));
  const dur = Math.round((Date.now() - a.start) / 60000);
  return `
    <div class="row between" style="margin-bottom:12px">
      <div><h2>Workout in progress</h2><div class="muted">Started ${new Date(a.start).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${dur} min</div></div>
    </div>
    ${a.entries.map(entryCard).join('')}
    <div class="card">
      <label>Add exercise to this workout</label>
      <div class="row">
        <select id="addExSel">${avail.length ? avail.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('') : '<option value="">No more exercises</option>'}</select>
        <button class="ghost" data-act="add-entry" style="white-space:nowrap">Add</button>
      </div>
      <div class="muted" style="margin-top:8px">Need something new? Add it in the Exercises tab.</div>
    </div>
    <button class="primary" data-act="finish">Finish workout</button>
    <button class="ghost danger" style="width:100%;margin-top:10px" data-act="discard">Discard workout</button>`;
}

function entryCard(en) {
  const ex = exById(en.exId); if (!ex) return '';
  const prev = lastSet(en.exId);
  return `<div class="card" data-ex="${en.exId}">
    <div class="row between">
      <h3>${esc(ex.name)}</h3>
      <button class="ghost" data-act="remove-entry" title="Remove from workout">✕</button>
    </div>
    <div class="muted">${prev ? `Last time: ${prev.w} kg × ${prev.r}` : 'First time — no history yet'}</div>
    <div class="steppers">
      <div><label>Weight (kg)</label>
        <div class="stepper"><button data-act="step" data-f="w" data-d="-2.5">−</button>
        <input type="number" inputmode="decimal" step="0.5" data-f="w" value="${en.w}">
        <button data-act="step" data-f="w" data-d="2.5">+</button></div></div>
      <div><label>Reps</label>
        <div class="stepper"><button data-act="step" data-f="r" data-d="-1">−</button>
        <input type="number" inputmode="numeric" data-f="r" value="${en.r}">
        <button data-act="step" data-f="r" data-d="1">+</button></div></div>
    </div>
    <div class="row">
      <div style="flex:0 0 130px"><label>Rest after set (sec)</label>
        <input type="number" inputmode="numeric" data-f="rest" value="${ex.rest}"></div>
      <button class="primary" data-act="log" style="margin-top:18px">Log set ✓</button>
    </div>
    ${en.sets.length ? `<div class="sets">${en.sets.map((s, i) => `
      <div class="set"><span class="n">#${i + 1}</span><span>${s.w} kg × ${s.r}</span>
      <button data-act="del-set" data-i="${i}" title="Delete set">✕</button></div>`).join('')}</div>` : ''}
  </div>`;
}

function viewExercises() {
  return `<div class="card">
      <h2>Add exercise</h2>
      <div class="row" style="margin-top:10px">
        <div style="flex:1"><label>Name</label><input id="newName" placeholder="e.g. Incline Dumbbell Press" maxlength="40"></div>
        <div style="flex:0 0 100px"><label>Rest (sec)</label><input id="newRest" type="number" inputmode="numeric" value="90"></div>
      </div>
      <div class="row" style="margin:10px 0;flex-wrap:wrap">
        ${[30, 60, 90, 120, 180].map(s => `<button class="ghost" data-act="rest-preset" data-s="${s}">${fmtRest(s)}</button>`).join('')}
      </div>
      <button class="primary" data-act="add-ex">Add exercise</button>
    </div>
    <div class="card">
      <h2>Your exercises</h2>
      <div class="muted" style="margin-bottom:12px">Set a default rest time for each. You can still change it during a workout.</div>
      ${state.exercises.length ? state.exercises.map(e => `
        <div class="ex-item" data-id="${e.id}">
          <div><label>Name</label><input data-f="name" value="${esc(e.name)}" maxlength="40"></div>
          <div><label>Rest (s)</label><input data-f="rest" type="number" inputmode="numeric" value="${e.rest}"></div>
          <button class="ghost danger" data-act="del-ex" title="Delete">🗑</button>
        </div>`).join('') : '<div class="empty">No exercises yet.</div>'}
    </div>`;
}

function viewHistory() {
  const list = [...state.sessions].reverse();
  return `
    ${list.length ? list.map(s => {
      const vol = s.entries.reduce((t, e) => t + e.sets.reduce((a, x) => a + x.w * x.r, 0), 0);
      const sets = s.entries.reduce((t, e) => t + e.sets.length, 0);
      return `<div class="card" data-sid="${s.id}">
        <div class="row between">
          <div><h3>${new Date(s.date).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'})}</h3>
          <div class="muted">${s.duration} min · ${sets} sets · ${Math.round(vol).toLocaleString()} kg volume</div></div>
          <button class="ghost danger" data-act="del-session" title="Delete">🗑</button>
        </div>
        ${s.entries.filter(e => e.sets.length).map(e => `<div class="hist-ex"><b>${esc(e.name)}</b>
          ${e.sets.map(x => `<span class="chip">${x.w}×${x.r}</span>`).join(' ')}</div>`).join('')}
      </div>`;
    }).join('') : '<div class="empty">No workouts yet.<br>Finish one and it will show up here.</div>'}
    <div class="card">
      <h3>Backup</h3>
      <div class="muted" style="margin:4px 0 10px">Your data is already saved in the cloud. You can also download a copy, or restore from one.</div>
      <div class="row">
        <button class="ghost" data-act="export" style="flex:1">Export JSON</button>
        <button class="ghost" data-act="import" style="flex:1">Import JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>`;
}

/* ---------- rest timer ---------- */
function startRest(seconds, exId) {
  if (seconds <= 0) return;
  rest = { end: Date.now() + seconds * 1000, total: seconds, exId, done: false };
  $('#restbar').classList.add('show');
  $('#restbar').classList.remove('done');
  $('#restLabel').textContent = 'Rest · ' + (exById(exId)?.name || '');
  clearInterval(timerId);
  timerId = setInterval(tick, 250);
  tick();
}
function tick() {
  if (!rest) return;
  const left = (rest.end - Date.now()) / 1000;
  $('#restTime').textContent = fmt(left);
  $('#restProg').style.width = Math.max(0, Math.min(100, left / rest.total * 100)) + '%';
  if (left <= 0 && !rest.done) {
    rest.done = true;
    $('#restbar').classList.add('done');
    $('#restLabel').textContent = 'Rest over — next set!';
    beep(); if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 500]);
    setTimeout(() => { if (rest && rest.done) stopRest(); }, 8000);
  }
}
function stopRest() { rest = null; clearInterval(timerId); $('#restbar').classList.remove('show'); }

let audioCtx;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
function beep() {
  try {
    unlockAudio(); if (!audioCtx) return;
    [0, 0.25, 0.5].forEach((t, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i === 2 ? 1100 : 800; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.22);
    });
  } catch (e) {}
}
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (state.active) keepAwake(true); tick(); }
});

/* ---------- actions ---------- */
function entryOf(el) {
  const card = el.closest('[data-ex]'); if (!card || !state.active) return [null, null];
  return [state.active.entries.find(e => e.exId === card.dataset.ex), card];
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  unlockAudio();
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const act = t.dataset.act;

  if (act === 'login') {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider).catch(err => {
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') return signInWithRedirect(auth, provider);
      if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
      const el = $('#loginErr'); if (el) el.textContent = 'Sign-in failed: ' + (err.code || err.message);
    });
  }
  else if (act === 'start') { state.active = { id: uid(), start: Date.now(), entries: [] }; persist(); keepAwake(true); render(); }

  else if (act === 'add-entry') {
    const id = $('#addExSel').value; if (!id) return;
    const ex = exById(id), p = lastSet(id);
    state.active.entries.push({ exId: id, name: ex.name, w: p ? p.w : 20, r: p ? p.r : 10, sets: [] });
    persist(); render();
  }
  else if (act === 'remove-entry') {
    const [en] = entryOf(t);
    if (en.sets.length && !confirm('Remove this exercise and its logged sets?')) return;
    state.active.entries = state.active.entries.filter(x => x !== en); persist(); render();
  }
  else if (act === 'step') {
    const [en, card] = entryOf(t); const f = t.dataset.f;
    en[f] = Math.max(0, Math.round((num(en[f]) + num(t.dataset.d)) * 10) / 10);
    card.querySelector(`input[data-f="${f}"]`).value = en[f]; persist();
  }
  else if (act === 'log') {
    const [en] = entryOf(t); const ex = exById(en.exId);
    if (num(en.r) <= 0) { alert('Enter reps first'); return; }
    en.sets.push({ w: num(en.w), r: num(en.r), t: Date.now() });
    persist(); render();
    startRest(ex.rest, en.exId);
  }
  else if (act === 'del-set') {
    const [en] = entryOf(t); en.sets.splice(+t.dataset.i, 1); persist(); render();
  }
  else if (act === 'finish') {
    const a = state.active;
    const entries = a.entries.filter(x => x.sets.length).map(x => ({ exId: x.exId, name: x.name, sets: x.sets }));
    if (!entries.length) { if (confirm('No sets logged. Discard this workout?')) { state.active = null; persist(); stopRest(); keepAwake(false); render(); } return; }
    const s = { id: a.id, date: a.start, duration: Math.max(1, Math.round((Date.now() - a.start) / 60000)), entries };
    state.sessions.push(s); saveSession(s);
    state.active = null; persist(); stopRest(); keepAwake(false); tab = 'history'; render();
  }
  else if (act === 'discard') {
    if (confirm('Discard this workout? Logged sets will be lost.')) { state.active = null; persist(); stopRest(); keepAwake(false); render(); }
  }
  else if (act === 'rest-adj') { if (rest) { rest.end += num(t.dataset.d) * 1000; rest.total = Math.max(rest.total, (rest.end - Date.now()) / 1000); if (rest.done && rest.end > Date.now()) { rest.done = false; $('#restbar').classList.remove('done'); $('#restLabel').textContent = 'Rest · ' + (exById(rest.exId)?.name || ''); } tick(); } }
  else if (act === 'rest-skip') stopRest();

  else if (act === 'rest-preset') $('#newRest').value = t.dataset.s;
  else if (act === 'add-ex') {
    const name = $('#newName').value.trim(); if (!name) { $('#newName').focus(); return; }
    if (state.exercises.some(x => x.name.toLowerCase() === name.toLowerCase())) { alert('That exercise already exists'); return; }
    state.exercises.push({ id: uid(), name, rest: Math.max(5, num($('#newRest').value, 90)) });
    persist(); render();
  }
  else if (act === 'del-ex') {
    const id = t.closest('[data-id]').dataset.id;
    if (confirm('Delete this exercise? Past history keeps its name.')) { state.exercises = state.exercises.filter(x => x.id !== id); persist(); render(); }
  }
  else if (act === 'del-session') {
    const id = t.closest('[data-sid]').dataset.sid;
    if (confirm('Delete this workout from history?')) { state.sessions = state.sessions.filter(s => s.id !== id); removeSession(id); render(); }
  }
  else if (act === 'export') {
    const blob = new Blob([JSON.stringify({ exercises: state.exercises, sessions: state.sessions }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'liftlog-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  }
  else if (act === 'import') $('#importFile').click();
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'importFile') {
    const f = t.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.exercises) || !Array.isArray(d.sessions)) throw 0;
        if (!confirm('Replace current data with this backup?')) return;
        const oldList = state.sessions;
        const newList = d.sessions.map(s => ({ ...s, id: s.id || uid() }));
        state.exercises = d.exercises; state.sessions = newList; state.active = null;
        persist(); replaceSessions(oldList, newList); render();
      } catch (x) { alert('That file is not a valid backup.'); }
    };
    r.readAsText(f); return;
  }
  const f = t.dataset.f; if (!f) return;
  const [en] = entryOf(t);
  if (en) {                                   // inside a workout card
    if (f === 'rest') { const ex = exById(en.exId); ex.rest = Math.max(5, num(t.value, ex.rest)); t.value = ex.rest; }
    else en[f] = Math.max(0, num(t.value));
    persist(); return;
  }
  const row = t.closest('[data-id]');         // exercise list
  if (row) {
    const ex = exById(row.dataset.id);
    if (f === 'name') { const v = t.value.trim(); if (v) ex.name = v; else t.value = ex.name; }
    if (f === 'rest') { ex.rest = Math.max(5, num(t.value, ex.rest)); t.value = ex.rest; }
    persist();
  }
});

/* sign out */
$('#logoutBtn').onclick = () => {
  if (!confirm('Sign out of LiftLog?')) return;
  flushMeta();
  setTimeout(() => signOut(auth), 300);
};

/* theme */
function applyTheme(th) { document.documentElement.dataset.theme = th; try { localStorage.setItem('liftlog.theme', th); } catch (e) {} }
$('#themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
try { applyTheme(localStorage.getItem('liftlog.theme') || 'dark'); } catch (e) { applyTheme('dark'); }

render();
</script>
</body>
